<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคลังข้อสอบภาษาอังกฤษ</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .filter-container {
      margin-bottom: 25px;
      padding: 15px;
      background: #eef2f3;
      border-radius: 8px;
    }
    .filter-container label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }
    .filter-container select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .question-card {
      background: #fafafa;
      border-left: 5px solid #3498db;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .passage-box {
      background: #e8f4fd;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      border-left: 5px solid #2980b9;
      font-style: italic;
    }
    .question-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .options-list label {
      display: block;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .options-list label:hover {
      background: #f1f1f1;
    }
    .options-list input {
      margin-right: 10px;
    }
    #quiz-container {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ระบบแบบทดสอบภาษาอังกฤษ</h1>
  
  <!-- เมนูดรอปดาวน์เลือกหมวดหมู่ -->
  <div class="filter-container">
    <label for="categorySelect">เลือกหมวดหมู่แบบทดสอบที่ต้องการทำ:</label>
    <select id="categorySelect" onchange="filterQuestionsByCategory(this.value)">
      <option value="ALL">-- แสดงข้อสอบทั้งหมด --</option>
      <optgroup label="📚 Grammar (ไวยากรณ์)">
        <option value="Preposition">Preposition (คำบุพบท)</option>
        <option value="If-Clause">If-Clause (ประโยคเงื่อนไข)</option>
        <option value="Passive Voice">Passive Voice</option>
        <option value="Tense">Tenses</option>
      </optgroup>
      <optgroup label="📝 หมวดอื่นๆ">
        <option value="Vocabulary">Vocabulary (คำศัพท์)</option>
        <option value="Conversation">Conversation (บทสนทนา)</option>
        <option value="Reading">Reading (อ่านจับใจความ)</option>
      </optgroup>
    </select>
  </div>

  <!-- พื้นที่แสดงข้อสอบ -->
  <div id="quiz-container"></div>
</div>

<script>
  // ฟังก์ชันช่วยสร้างโครงสร้างข้อสอบ
  function _(level, subCat, category, question, options, answer, explanation, passage = "", passageId = 0) {
    return { level, subCategory: subCat, category, question, options, answer, explanation, passage, passageId };
  }

  const Pu = 1;
  const ts = 2;

  // ฐานข้อมูลข้อสอบทั้งหมด
  const examDatabase = [
    // 1. Preposition
    _("ม.3", "Preposition", "Grammar", "Nok usually goes to school ______ 7:00 AM.", ["at", "in", "on", "by"], 0, "ใช้ at กับเวลาที่เป็นจุดชัดเจนบนนาฬิกา"),
    _("ม.3", "Preposition", "Grammar", "The cat is sleeping ______ the table.", ["under", "between", "among", "into"], 0, "under แปลว่า อยู่ใต้/ล่าง"),
    _("ม.3", "Preposition", "Grammar", "We always have lunch together ______ noon.", ["at", "on", "in", "for"], 0, "ใช้คำว่า at noon"),

    // 2. If-Clause
    _("ม.3", "If-Clause", "Grammar", "If it rains tomorrow, we ______ at home.", ["will stay", "stayed", "would stay", "had stayed"], 0, "If-Clause Type 1: If + Present Simple, Future Simple (will + V.1)"),
    _("ม.3", "If-Clause", "Grammar", "If I ______ rich, I would travel around the world.", ["were", "am", "will be", "have been"], 0, "If-Clause Type 2: สมมติในปัจจุบันใช้ If + Past Simple (ใช้ were เสมอกับทุกประธาน)"),
    _("ม.3", "If-Clause", "Grammar", "She would pass the exam if she ______ harder.", ["studied", "studies", "study", "will study"], 0, "If-Clause Type 2: would + V.1 + if + Past Simple (V.2)"),

    // 3. Passive Voice & Tenses
    _("ม.3", "Passive Voice", "Grammar", "This English book ______ by a famous author last year.", ["was written", "wrote", "is writing", "writes"], 0, "Passive Voice ในอดีต: Subject + was/were + V.3"),
    _("ม.3", "Tense", "Grammar", "They ______ English for five years.", ["have studied", "study", "studying", "studied"], 0, "Present Perfect: เหตุการณ์ที่เกิดตั้งแต่อดีตต่อเนื่องถึงปัจจุบัน (for + ระยะเวลา)"),

    // 4. Vocabulary
    _("ม.3", "Vocabulary", "Meaning", "The weather is very ______ today. Please take an umbrella.", ["rainy", "sunny", "dry", "windy"], 0, "บริบทบอกให้พกร่ม คำตอบคือ rainy (ฝนตก)"),
    _("ม.3", "Vocabulary", "Synonym", "What is the synonym of the word 'huge'?", ["enormous", "tiny", "narrow", "short"], 0, "huge แปลว่าใหญ่โต มีความหมายเดียวกับ enormous"),

    // 5. Conversation
    _("ม.3", "Conversation", "Daily Life", "A: How do you do?\nB: ______", ["How do you do?", "I'm fine, thank you.", "Nice to meet you.", "Good morning."], 0, "ทักทายแบบเป็นทางการ How do you do? ต้องตอบกลับด้วย How do you do?"),

    // 6. Reading
    _("ม.3", "Reading", "Details", "What time does Nok wake up everyday?", ["5:30 AM", "6:30 AM", "7:00 AM", "8:00 AM"], 0, "อ้างอิงจากบทอ่าน Passage A", "Passage A: Nok is a student who wakes up at 5:30 AM everyday to help her mother before going to school.", Pu),
    _("ม.3", "Reading", "Details", "How does Nok go to school?", ["By bike", "By bus", "On foot", "By boat"], 0, "อ้างอิงจากบทอ่าน Passage A", "Passage A: Nok is a student who wakes up at 5:30 AM everyday to help her mother before going to school.", Pu),

    _("ม.3", "Reading", "Rules", "How many books can a student borrow at a time?", ["3 books", "5 books", "2 books", "1 book"], 0, "อ้างอิงจากกฎระเบียบห้องสมุดใน Passage B", "Passage B: Library Rules - Students are allowed to borrow a maximum of 3 books for two weeks.", ts),
    _("ม.3", "Reading", "Rules", "What is the fine if a student returns a book late?", ["5 baht per day", "10 baht per day", "Free", "20 baht per day"], 0, "อ้างอิงจาก Passage B", "Passage B: Library Rules - Students are allowed to borrow a maximum of 3 books for two weeks.", ts)
  ];

  // ฟังก์ชันแสดงผลข้อสอบลงในหน้าเว็บ
  function renderQuiz(questionsToRender) {
    const container = document.getElementById("quiz-container");
    container.innerHTML = "";

    if (questionsToRender.length === 0) {
      container.innerHTML = "<p style='text-align:center; color: #7f8c8d;'>ไม่พบข้อสอบในหมวดหมู่ที่คุณเลือก</p>";
      return;
    }

    let lastPassage = "";

    questionsToRender.forEach((q, index) => {
      const card = document.createElement("div");
      card.className = "question-card";

      let htmlContent = "";

      if (q.category === "Reading" && q.passage && q.passage !== lastPassage) {
        htmlContent += `<div class="passage-box"><b>📖 บทอ่าน (Passage):</b><br>${q.passage}</div>`;
        lastPassage = q.passage;
      }

      htmlContent += `<div class="question-title">ข้อที่ ${index + 1} [${q.subCategory}]: ${q.question.replace(/\n/g, '<br>')}</div>`;
      htmlContent += `<div class="options-list">`;

      q.options.forEach((opt, optIndex) => {
        htmlContent += `
          <label>
            <input type="radio" name="question_${index}" value="${optIndex}">
            ${String.fromCharCode(65 + optIndex)}. ${opt}
          </label>
        `;
      });

      htmlContent += `</div>`;
      card.innerHTML = htmlContent;
      container.appendChild(card);
    });
  }

  // ฟังก์ชันกรองข้อสอบเมื่อผู้ใช้เลือกหมวดหมู่
  function filterQuestionsByCategory(selectedCategory) {
    let filteredList = [];

    if (selectedCategory === "ALL") {
      filteredList = examDatabase;
    } else {
      filteredList = examDatabase.filter(q => q.subCategory === selectedCategory || q.category === selectedCategory);
    }

    if (selectedCategory === "Reading") {
      filteredList.sort((a, b) => a.passageId - b.passageId);
    }

    renderQuiz(filteredList);
  }

  // โหลดแสดงข้อสอบทั้งหมดเริ่มต้นเมื่อเปิดหน้าเว็บ
  window.onload = function() {
    renderQuiz(examDatabase);
  };
</script>

</body>
</html>
